<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>XnneHangLab Launcher Template</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('xnnehanglab.theme') === 'day' ? 'day' : 'night';
      } catch { /* Default tokens use the night theme when storage is unavailable. */ }
    </script>
    <style>
      html, body { margin: 0; background: var(--shell-bg); }
      .startup-status {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 12px;
        color: var(--text);
        font: 16px system-ui, sans-serif;
      }
      .startup-mascot { width: 140px; height: 120px; overflow: visible; }
      .startup-cat {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: startup-hop 1.6s ease-in-out infinite;
      }
      .startup-stars { animation: startup-twinkle 1.6s ease-in-out infinite alternate; }
      @keyframes startup-hop {
        0%, 100% { transform: translateY(0) scale(1.03, 0.97); }
        50% { transform: translateY(-8px) scale(0.98, 1.02); }
      }
      @keyframes startup-twinkle {
        from { opacity: 0.35; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-cat, .startup-stars { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-status" role="status">
        <svg class="startup-mascot" viewBox="0 0 140 120" aria-hidden="true" focusable="false">
          <ellipse cx="70" cy="106" rx="31" ry="5" fill="#bda2df" opacity="0.15" />
          <g class="startup-stars" fill="#d7b9ff">
            <path d="M18 33l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" />
            <path d="M120 58l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffb9d4" />
            <circle cx="111" cy="26" r="3" fill="#ffdaac" />
          </g>
          <g class="startup-cat">
            <path d="M35 60L32 29Q33 23 39 28L54 42Q70 36 86 42L101 28Q107 23 108 29L105 60Q118 99 70 99Q22 99 35 60Z"
              fill="#f4eaff" stroke="#c5a7df" stroke-width="2.5" stroke-linejoin="round" />
            <path d="M39 36l2 16 9-7zM101 36l-2 16-9-7z" fill="#f3b8d2" />
            <ellipse cx="45" cy="77" rx="7" ry="4" fill="#f4b6ce" />
            <ellipse cx="95" cy="77" rx="7" ry="4" fill="#f4b6ce" />
            <g fill="none" stroke="#655078" stroke-width="3" stroke-linecap="round">
              <path d="M48 67q4-5 8 0M84 67q4-5 8 0" />
              <path d="M63 76q3 7 7 0q4 7 7 0" stroke-width="2" />
            </g>
          </g>
        </svg>
        <span>正在唤醒绘心…</span>
      </div>
    </div>
    <script src="/live2dcubismcore.min.js"></script>
    <script type="module">
      import { getCurrentWebviewWindow } from '@tauri-apps/api/webviewWindow';

      if ('__TAURI_INTERNALS__' in window) {
        const appWindow = getCurrentWebviewWindow();
        const background = getComputedStyle(document.documentElement).getPropertyValue('--shell-bg').trim();
        appWindow.setBackgroundColor(background)
          .catch(console.error)
          .then(() => appWindow.show())
          .catch(console.error);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
